[package]
name = "ringleader"
version = "1.0.0"
edition = "2024"
description = "Fast, lightweight fan & RGB control for Thermaltake Riing Quad controllers (Windows & Linux)"
authors = ["Astro <https://zonastro.com>"]
license = "MIT"
homepage = "https://zonastro.com"
keywords = ["thermaltake", "fan-control", "rgb", "riing"]
categories = ["hardware-support"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native", "linux-native-basic-udev"] }
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.191"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
